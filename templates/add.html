{% extends 'layout.html' %}

{% block content %}

<h2>Add Employee</h2>

<form method="POST">

<label>Name</label>

<input
type="text"
name="name"
required>

<label>Email</label>

<input
type="email"
name="email"
required>

<label>Department</label>

<input
type="text"
name="department"
required>

<label>Salary</label>

<input
type="number"
name="salary"
required>

<button type="submit">

Add Employee

</button>

</form>

{% endblock %}
